<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A tiny, shareable trip-expense splitter." />
  <title>Spliter — settle a trip</title>
  <style>
    :root {
      color: #1b2b28;
      background: #f5f1e7;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 20rem; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #ec8e38; outline-offset: 2px; }

    .shell { width: min(100% - 2rem, 72rem); margin: 0 auto; padding: 3.5rem 0 5rem; }
    .masthead { display: flex; justify-content: space-between; align-items: start; gap: 2rem; margin-bottom: 3rem; }
    .eyebrow { margin: 0 0 .65rem; color: #0d7165; font-size: .78rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 10ch; color: #143d38; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3.3rem, 8vw, 5.8rem); font-weight: 500; letter-spacing: -.065em; line-height: .88; }
    .intro { max-width: 31rem; margin: 1.2rem 0 0; color: #52655e; font-size: 1.05rem; line-height: 1.55; }
    .reset { flex: none; margin-top: .4rem; border: 1px solid #c7cec0; border-radius: 999px; padding: .6rem .95rem; color: #35514a; background: transparent; font-size: .9rem; font-weight: 700; }
    .reset:hover { background: #e6eadf; }

    .layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(19rem, .75fr); align-items: start; gap: 1.4rem; }
    .trip-card, .settlement { border: 1px solid #d9dfd2; border-radius: 1.4rem; background: #fffdf8; box-shadow: 0 1rem 2.5rem rgba(37, 57, 46, .08); }
    .trip-card { overflow: hidden; }
    .section { padding: 1.4rem; }
    .section + .section { border-top: 1px solid #e6e8df; }
    .section-head, .settlement-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    h2 { margin: 0; color: #143d38; font-family: Georgia, "Times New Roman", serif; font-size: 1.55rem; font-weight: 500; letter-spacing: -.03em; }
    .section-note { margin: .25rem 0 0; color: #7a8780; font-size: .9rem; line-height: 1.4; }

    .person-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .6rem; margin-top: 1rem; }
    .person-input { position: relative; display: flex; min-width: 0; }
    .person-input input { width: 100%; border: 1px solid #cdd6ca; border-radius: .7rem; padding: .7rem 2rem .7rem .75rem; color: #183a34; background: #fbfcf8; font-weight: 700; }
    .icon-button { position: absolute; top: 50%; right: .42rem; width: 1.4rem; height: 1.4rem; border: 0; border-radius: 50%; transform: translateY(-50%); color: #72817a; background: transparent; font-size: 1.35rem; line-height: 1; }
    .icon-button:hover { color: #9c3d2c; background: #f7e7e2; }
    .icon-button:disabled { visibility: hidden; }
    .add-link, .add-expense { margin-top: .85rem; border: 0; padding: .35rem 0; color: #087b6c; background: transparent; font-weight: 800; text-decoration: underline; text-underline-offset: .18em; }
    .add-link:hover, .add-expense:hover { color: #0d554c; }

    #expense-list { display: grid; gap: .9rem; margin-top: 1rem; }
    .expense-card { border: 1px solid #dce3d7; border-radius: 1rem; padding: 1rem; background: #fcfdf9; }
    .expense-topline { display: grid; grid-template-columns: minmax(0, 1fr) 7.2rem auto; gap: .65rem; align-items: end; }
    .field { display: grid; gap: .3rem; min-width: 0; color: #67766e; font-size: .75rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    input, select { min-width: 0; border: 1px solid #cbd5c8; border-radius: .55rem; padding: .58rem .65rem; color: #1b4039; background: #fff; font-size: .96rem; font-weight: 600; letter-spacing: 0; text-transform: none; }
    .money-input { display: flex; align-items: center; gap: .15rem; border: 1px solid #cbd5c8; border-radius: .55rem; padding-left: .6rem; color: #1b4039; background: #fff; font-size: .96rem; font-weight: 700; letter-spacing: 0; text-transform: none; }
    .money-input input { width: 100%; border: 0; padding-left: 0; }
    .remove-expense { border: 0; padding: .58rem 0; color: #9b4b3c; background: transparent; font-size: .82rem; font-weight: 800; }
    .remove-expense:hover { text-decoration: underline; text-underline-offset: .2em; }
    .paid-by { width: min(100%, 15rem); margin-top: .85rem; }
    .shares { display: grid; grid-template-columns: 10.5rem minmax(0, 1fr); gap: 1rem; align-items: center; margin-top: 1rem; padding-top: .9rem; border-top: 1px dashed #d5ddd1; }
    .shares strong { color: #24463f; font-size: .86rem; }
    .shares p { margin: .18rem 0 0; color: #76857d; font-size: .76rem; line-height: 1.35; }
    .share-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(4.6rem, 1fr)); gap: .45rem; }
    .share-field { display: grid; gap: .25rem; color: #6c7b73; font-size: .72rem; font-weight: 750; }
    .share-field input { padding: .45rem .5rem; }
    .expense-breakdown { margin-top: .9rem; padding-top: .85rem; border-top: 1px dashed #d5ddd1; color: #5f7068; font-size: .8rem; }
    .expense-breakdown > strong { color: #24463f; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
    .expense-breakdown ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .35rem .8rem; margin: .6rem 0 0; padding: 0; list-style: none; }
    .expense-breakdown li { display: grid; grid-template-columns: 1fr auto; column-gap: .8rem; align-items: baseline; padding: .35rem 0; border-bottom: 1px solid #edf0e9; }
    .expense-breakdown li > strong { color: #294942; }
    .expense-breakdown li > span { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: .8rem; font-size: .75rem; }
    .expense-breakdown b { color: #087b6c; font-size: .8rem; }
    .expense-breakdown .expense-not-paid b { color: #7b8982; font-weight: 650; }
    .empty-expenses { margin: 0; color: #74827a; font-style: italic; }

    .settlement { position: sticky; top: 1rem; overflow: hidden; }
    .settlement-head { padding: 1.4rem 1.4rem 1rem; color: #ec8731; }
    .settlement-head h2 { color: #143d38; }
    #transfer-count { border-radius: 999px; padding: .35rem .6rem; color: #9c4a17; background: #fff0df; font-size: .76rem; font-weight: 800; white-space: nowrap; }
    .transfer-list { display: grid; gap: .55rem; margin: 0; padding: 0 1.4rem 1.25rem; list-style: none; }
    .transfer-list li { display: grid; grid-template-columns: 1fr auto 1fr; gap: .45rem; align-items: center; border-radius: .75rem; padding: .7rem; background: #f0f6ed; color: #34514a; font-size: .88rem; }
    .transfer-list span { color: #708078; font-size: .76rem; }
    .transfer-list b { grid-column: 1 / -1; color: #087b6c; font-size: 1rem; }
    .transfer-list .settled-message { display: block; color: #397365; background: #e7f3ed; text-align: center; font-weight: 700; }
    .balances { margin: 0; padding: 1.1rem 1.4rem 1.4rem; border-top: 1px solid #e4e8df; list-style: none; }
    .balances li { display: flex; justify-content: space-between; gap: 1rem; padding: .47rem 0; color: #26463f; font-size: .9rem; }
    .balances li + li { border-top: 1px solid #edf0e9; }
    .balances li > span:first-child { font-weight: 750; }
    .balances li > span:last-child { text-align: right; font-size: .84rem; }
    .is-owed { color: #087b6c; } .owes { color: #a94e31; } .settled { color: #75827b; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }

    @media (max-width: 50rem) { .layout { grid-template-columns: 1fr; } .settlement { position: static; } }
    @media (max-width: 34rem) { .shell { width: min(100% - 1.2rem, 72rem); padding-top: 2rem; } .masthead { align-items: end; gap: 1rem; margin-bottom: 2rem; } .reset { font-size: .76rem; } .section, .settlement-head { padding-right: 1rem; padding-left: 1rem; } .expense-topline { grid-template-columns: 1fr 6rem; } .remove-expense { grid-column: 1 / -1; justify-self: start; } .shares { grid-template-columns: 1fr; } .transfer-list, .balances { padding-right: 1rem; padding-left: 1rem; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Trip maths, without accounts</p>
        <h1>Split it simply.</h1>
        <p class="intro">Add what people paid, choose each person’s share, and settle the whole trip with the fewest useful transfers.</p>
      </div>
      <button class="reset" type="button" id="reset-trip">Reset example</button>
    </header>

    <div class="layout">
      <section class="trip-card" aria-label="Trip expenses">
        <section class="section" aria-labelledby="people-heading">
          <div class="section-head"><div><h2 id="people-heading">Who went?</h2><p class="section-note">Their names are part of the shareable link.</p></div></div>
          <div class="person-list" id="person-inputs"></div>
          <button class="add-link" type="button" id="add-person">+ Add person</button>
        </section>
        <section class="section" aria-labelledby="expenses-heading">
          <div class="section-head"><div><h2 id="expenses-heading">What was paid?</h2><p class="section-note">A weight of 2 gets twice the share of a weight of 1.</p></div></div>
          <div id="expense-list"></div>
          <button class="add-expense" type="button" id="add-expense">+ Add an expense</button>
        </section>
      </section>

      <aside class="settlement" aria-labelledby="settlement-heading">
        <div class="settlement-head"><h2 id="settlement-heading">Settle up</h2><span id="transfer-count"></span></div>
        <ol class="transfer-list" id="transfers" aria-live="polite"></ol>
        <ul class="balances" id="balances" aria-label="Balances"></ul>
      </aside>
    </div>
  </main>
  <script type="module">
    import { setupApp } from './app.js';
    setupApp();
  </script>
</body>
</html>
